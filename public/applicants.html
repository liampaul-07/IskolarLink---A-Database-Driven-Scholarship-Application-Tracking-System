<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IskolarLink - Applicants</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="topbar">
    <h1>IskolarLink</h1>
    <nav class="topbar-right" id="topbar-right"></nav>
  </header>

  <main class="wide-main">
    <div id="banner" class="banner" role="status" hidden></div>

    <div class="page-head">
      <div>
        <h2>Applicants</h2>
        <p>Keep applicant records up to date: personal details, school information and household income.</p>
      </div>
      <button id="btn-new" class="btn primary" type="button">+ New applicant</button>
    </div>

    <section class="stats stats-2" aria-label="Applicant summary">
      <div class="stat">
        <div class="stat-label">Total applicants</div>
        <div class="stat-value" id="stat-total">-</div>
      </div>
      <div class="stat">
        <div class="stat-label">In this list</div>
        <div class="stat-value" id="stat-shown">-</div>
      </div>
    </section>

    <section class="toolbar">
      <input id="filter-q" type="search" placeholder="Search by name" aria-label="Search applicants by name">
      <label><input id="filter-archived" type="checkbox"> Show archived</label>
    </section>

    <table>
      <thead>
        <tr>
          <th>Applicant</th>
          <th>Birth date</th>
          <th>School / course</th>
          <th class="num">GWA</th>
          <th class="num">Monthly income</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="applicants-body"></tbody>
    </table>

    <div class="pager">
      <span id="pager-info"></span>
      <button id="btn-prev" class="btn small" type="button">Previous</button>
      <button id="btn-next" class="btn small" type="button">Next</button>
    </div>
  </main>

  <dialog id="applicant-dialog" class="wide">
    <form id="applicant-form" novalidate>
      <h2 id="applicant-dialog-title">New applicant</h2>
      <div id="applicant-errors" class="form-errors" hidden></div>
      <input type="hidden" id="applicant-id">

      <div class="row">
        <div class="field">
          <label for="a-first">First name</label>
          <input id="a-first" type="text" autocomplete="off">
        </div>
        <div class="field">
          <label for="a-middle">Middle name (optional)</label>
          <input id="a-middle" type="text" autocomplete="off">
        </div>
        <div class="field">
          <label for="a-last">Last name</label>
          <input id="a-last" type="text" autocomplete="off">
        </div>
      </div>
      <div class="row">
        <div class="field">
          <label for="a-birth">Birth date</label>
          <input id="a-birth" type="date">
        </div>
        <div class="field">
          <label for="a-sex">Sex (optional)</label>
          <select id="a-sex">
            <option value="">Not specified</option>
            <option value="female">Female</option>
            <option value="male">Male</option>
          </select>
        </div>
      </div>
      <div class="row">
        <div class="field">
          <label for="a-email">Email (optional)</label>
          <input id="a-email" type="text" autocomplete="off">
        </div>
        <div class="field">
          <label for="a-phone">Contact number (optional)</label>
          <input id="a-phone" type="text" autocomplete="off">
        </div>
      </div>
      <div class="field">
        <label for="a-address">Address</label>
        <input id="a-address" type="text" autocomplete="off">
      </div>
      <div class="row">
        <div class="field">
          <label for="a-school">School (optional)</label>
          <input id="a-school" type="text" autocomplete="off">
        </div>
        <div class="field">
          <label for="a-course">Course or strand (optional)</label>
          <input id="a-course" type="text" autocomplete="off">
        </div>
      </div>
      <div class="row">
        <div class="field">
          <label for="a-year">Year level (optional)</label>
          <input id="a-year" type="text" autocomplete="off">
        </div>
        <div class="field">
          <label for="a-gwa">GWA (optional)</label>
          <input id="a-gwa" type="text" inputmode="decimal">
        </div>
        <div class="field">
          <label for="a-income">Monthly household income (optional)</label>
          <input id="a-income" type="text" inputmode="decimal">
        </div>
      </div>

      <div id="applicant-apps" hidden>
        <h3>Applications</h3>
        <ul id="applicant-apps-list" class="plain-list"></ul>
      </div>

      <div class="dialog-actions">
        <button type="button" class="btn" id="btn-applicant-cancel">Cancel</button>
        <button type="submit" class="btn primary">Save</button>
      </div>
    </form>
  </dialog>

  <script src="/js/confirm.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/applicants.js"></script>
</body>
</html>
